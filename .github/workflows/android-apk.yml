# Builds the Android APK on GitHub's free Linux runners (Java + Android SDK preinstalled).
# Branches: 1 feature = 1 branch from main, merged into a batch ("lot") branch also taken from
# main; the batch is merged into main when it should ship.
# - Every push to main (i.e. a batch merge): new GitHub Release "v<version>" with the APK, downloadable
#   straight from the phone (marked "Latest").
# - Manual run (Actions tab › "Android APK" › Run workflow): same, from any branch.
# Versions come from scripts/app-version.mjs: set 1.2.0 in app.json, then +1 per merge into main.
# versionCode = total commit count, so each APK installs over the previous one (main only moves
# forward: merges, never rewritten).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write # needed to create the release

concurrency:
  group: android-apk-${{ github.ref }}
  # Several pushes in a row: only the latest one gets built.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: versionCode is the commit count

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle dependencies and build outputs between runs (much faster rebuilds).
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, tests
        run: |
          npm run lint
          npm run typecheck
          npm test -- --ci

      - name: Build APK
        env:
          # GitHub runners have more memory than the laptop: allow more parallel work.
          WORKERS: '4'
        run: bash scripts/build-apk.sh

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(cat dist/version.txt)
          cp dist/rooots.apk "dist/rooots-$VERSION.apk"
          echo "file=dist/rooots-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Rooots $VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rooots-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publish a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.apk.outputs.name }}
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          make_latest: 'true'
