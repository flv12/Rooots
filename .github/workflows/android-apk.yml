# Builds the Android APK on GitHub's free Linux runners (Java + Android SDK preinstalled).
# - Manual run (Actions tab › "Android APK" › Run workflow): APK available as an artifact.
# - Tag push (e.g. `git tag v1.1.0 && git push --tags`): APK also attached to a GitHub Release,
#   downloadable straight from the phone.
# Remember to bump expo.version and expo.android.versionCode in app.json before tagging.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release on tags

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle dependencies and build outputs between runs (much faster rebuilds).
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, tests
        run: |
          npm run lint
          npm run typecheck
          npm test -- --ci

      - name: Build APK
        env:
          # GitHub runners have more memory than the laptop: allow more parallel work.
          WORKERS: '4'
        run: bash scripts/build-apk.sh

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp dist/rooots.apk "dist/rooots-$VERSION.apk"
          echo "file=dist/rooots-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rooots-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 90

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
